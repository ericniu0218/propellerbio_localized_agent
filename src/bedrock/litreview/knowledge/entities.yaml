# Exact-name tables. Code reads these; no model ever writes to them.
#
# `terms`      names that mean exactly this entity: abbreviations, brand names,
#              code names, spelling variants. A paper using any of them is about
#              this entity.
# `near_miss`  names that are close but are NOT this entity — a sibling virus,
#              a drug in the same class, a neighbouring disease. The client asked
#              for answers about the exact thing, not about things that look
#              close enough, so a paper that only mentions these is excluded,
#              with that reason shown.
# `near_miss_patterns`  regexes for families too large to list (flu subtypes).
#
# Deliberately left out of `terms`: ambiguous short forms. "AD" is atopic
# dermatitis and Alzheimer's disease; "RA" is rheumatoid arthritis and retinoic
# acid; "p19" is IL-23 and p19ARF. A missing synonym costs recall, and the
# report shows which terms were used so a scientist can add one. A wrong
# synonym silently lets the wrong papers in.
#
# Matching is case-insensitive except for short acronyms (RSV, PsA, H5N1),
# which match case-sensitively. Hyphens and spaces are interchangeable.

diseases:
  psoriasis:
    terms: [psoriasis, psoriatic, psoriasiform, plaque psoriasis, psoriasis vulgaris, psoriasis-like]
    near_miss: [psoriatic arthritis, PsA, atopic dermatitis, atopic eczema, seborrheic dermatitis, lichen planus, rosacea, palmoplantar pustulosis]
  psoriatic arthritis:
    terms: [psoriatic arthritis, PsA]
    near_miss: [rheumatoid arthritis, ankylosing spondylitis, axial spondyloarthritis, osteoarthritis]
  atopic dermatitis:
    terms: [atopic dermatitis, atopic eczema]
    near_miss: [psoriasis, contact dermatitis, seborrheic dermatitis, chronic urticaria]
  rheumatoid arthritis:
    terms: [rheumatoid arthritis]
    near_miss: [osteoarthritis, psoriatic arthritis, juvenile idiopathic arthritis, systemic lupus erythematosus, ankylosing spondylitis]
  crohn's disease:
    terms: [Crohn's disease, Crohn disease, Crohns disease, Crohn's]
    near_miss: [ulcerative colitis, irritable bowel syndrome, celiac disease]
  ulcerative colitis:
    terms: [ulcerative colitis]
    near_miss: [Crohn's disease, Crohn disease, irritable bowel syndrome, celiac disease]
  inflammatory bowel disease:
    terms: [inflammatory bowel disease, IBD]
    near_miss: [irritable bowel syndrome, IBS, celiac disease]
  systemic lupus erythematosus:
    terms: [systemic lupus erythematosus, SLE, lupus]
    near_miss: [rheumatoid arthritis, Sjogren's syndrome, systemic sclerosis, cutaneous lupus erythematosus]
  multiple sclerosis:
    terms: [multiple sclerosis]
    near_miss: [neuromyelitis optica, NMOSD, acute disseminated encephalomyelitis]
  asthma:
    terms: [asthma, asthmatic]
    near_miss: [chronic obstructive pulmonary disease, COPD, allergic rhinitis]
  obesity:
    terms: [obesity, obese, diet-induced obesity]
    near_miss: [overweight, cachexia, lipodystrophy, anorexia nervosa]
  type 2 diabetes:
    terms: [type 2 diabetes, type 2 diabetes mellitus, T2D, T2DM, non-insulin-dependent diabetes]
    near_miss: [type 1 diabetes, T1D, T1DM, gestational diabetes, prediabetes]
  type 1 diabetes:
    terms: [type 1 diabetes, type 1 diabetes mellitus, T1D, T1DM, insulin-dependent diabetes]
    near_miss: [type 2 diabetes, T2D, T2DM, gestational diabetes]
  # Liver fat, as questions ask about it ("does X reduce liver fat?"), and the
  # names papers report it under: the disease it defines (MASLD, formerly
  # NAFLD/MAFLD) and the measurements of it (MRI-PDFF, fatty liver index,
  # intrahepatic lipid). Added after a tirzepatide question matched "liver fat"
  # verbatim only, and 198 of 200 collected papers - including every paper
  # that measured liver fat as MASLD or PDFF - were excluded. Steatohepatitis
  # (MASH/NASH) is deliberately neither a term nor a near-miss: it is liver fat
  # with inflammation, its papers usually report fat as well, and they should
  # pass or fail on their own words. Bare "steatosis" and "FLI" are left out as
  # ambiguous; a paper's own "fatty liver index (FLI)" definition is still read.
  hepatic steatosis:
    terms: [liver fat, liver fat content, liver fat fraction, hepatic fat, hepatic fat content, hepatic fat fraction,
            intrahepatic lipid, intrahepatic lipids, intrahepatic fat, intrahepatic triglyceride, intrahepatic triglycerides,
            hepatic triglyceride content, hepatic steatosis, liver steatosis, fatty liver, fatty liver disease, fatty liver index,
            steatotic liver disease, steatotic liver, metabolic dysfunction-associated steatotic liver disease, MASLD,
            metabolic dysfunction-associated fatty liver disease, metabolic associated fatty liver disease, MAFLD,
            nonalcoholic fatty liver disease, non-alcoholic fatty liver disease, NAFLD, nonalcoholic fatty liver,
            non-alcoholic fatty liver, proton density fat fraction, MRI-PDFF]
    near_miss: [alcoholic fatty liver disease, alcohol-associated liver disease, alcohol-related liver disease,
                alcoholic liver disease, hepatitis C, hepatitis B]
  metabolic dysfunction-associated steatohepatitis:
    terms: [metabolic dysfunction-associated steatohepatitis, MASH, nonalcoholic steatohepatitis, non-alcoholic steatohepatitis, NASH]
    near_miss: [alcoholic hepatitis, alcohol-associated hepatitis, hepatitis C]
  alzheimer's disease:
    terms: [Alzheimer's disease, Alzheimer disease, Alzheimers disease, Alzheimer's]
    near_miss: [frontotemporal dementia, vascular dementia, dementia with Lewy bodies, Lewy body dementia, Parkinson's disease]
  parkinson's disease:
    terms: [Parkinson's disease, Parkinson disease, Parkinsons disease]
    near_miss: [multiple system atrophy, progressive supranuclear palsy, dementia with Lewy bodies, essential tremor]
  amyotrophic lateral sclerosis:
    terms: [amyotrophic lateral sclerosis, ALS]
    near_miss: [frontotemporal dementia, spinal muscular atrophy, primary lateral sclerosis]
  major depressive disorder:
    terms: [major depressive disorder, MDD, major depression]
    near_miss: [bipolar disorder, dysthymia, generalized anxiety disorder]
  migraine:
    terms: [migraine]
    near_miss: [cluster headache, tension-type headache]
  covid-19:
    terms: [COVID-19, COVID, coronavirus disease 2019]
    near_miss: [MERS, Middle East respiratory syndrome, influenza]

