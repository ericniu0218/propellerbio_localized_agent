name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.deps }} dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # "full" installs requirements.txt as documented in the README.
        # "minimal" then removes the optional biotech libraries, because
        # app/tools/chemistry_tools.py and app/tools/sequence_tools.py claim
        # to degrade to stub results when they are absent. That claim is only
        # true until someone adds an unguarded import, so CI checks it.
        deps: [full, minimal]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt installs the meeting transcript reader from the
      # private bedrock-private-ai repo, which this workflow's own GITHUB_TOKEN
      # cannot read. BEDROCK_PRIVATE_AI_TOKEN is a read-only token for that
      # one repo; the rewrite below only applies to that repo's URL.
      - name: Allow access to bedrock-private-ai
        env:
          TOKEN: ${{ secrets.BEDROCK_PRIVATE_AI_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The BEDROCK_PRIVATE_AI_TOKEN secret is not set. Add a read-only token for Bedrock-Technical-Consulting/bedrock-private-ai in the repository settings."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/Bedrock-Technical-Consulting/bedrock-private-ai".insteadOf \
            "https://github.com/Bedrock-Technical-Consulting/bedrock-private-ai"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Remove optional biotech dependencies
        if: matrix.deps == 'minimal'
        run: pip uninstall --yes rdkit biopython

      # AGENT_PACK_MODE, DATABASE_URL and AIRGAP_CHECK are set by
      # tests/conftest.py against a temporary SQLite file. Deliberately not
      # duplicated here, so the test setup has exactly one owner.
      - name: Run tests
        run: PYTHONPATH=. pytest -q
