# Model names for the literature review, and nothing else about the server.
# The server is bedrock's own (`api_base` in ~/.config/bedrock/config.toml, or
# BEDROCK_API_BASE), and every call waits its turn in bedrock's scheduler.
# Model names live here and nowhere else. To change them on one machine, put a
# whole replacement of this file in ~/.config/bedrock/litreview/models.yaml.
#
# Choose a set with `model_set` in [litreview], BEDROCK_LITREVIEW_MODELS or
# --models. Default: `office` on the `server` machine profile, else `laptop`.
# Tiers are split by COST, not skill: relevance runs once per paper, so it may
# use the cheap model; everything else runs tens of times per question.

# Extraction sends about 4,300 prompt tokens and allows a 4,096-token reply.
# The server's window (bedrock's `context_window`, which must match
# OLLAMA_CONTEXT_LENGTH or vLLM --max-model-len) must be at least this.
min_context_window: 12288

model_sets:
  # UNCONFIRMED: these two names are guesses and have never been checked against
  # the client's server. A vLLM server answers to whatever it was started with
  # (--served-model-name), which by default is the full path, such as
  # "Qwen/Qwen3-30B-A3B-Instruct-2507" — not a short name like these.
  #
  # Nothing silently goes wrong if they are wrong: `service.preflight` asks the
  # server what it has before a run starts, and refuses with the names it really
  # offers. `bedrock-litreview doctor` asks the same question without starting a
  # run, and is the quickest way to find out on the day the office GPU exists.
  #
  # To fix without waiting for a release, copy this whole file to
  # ~/.config/bedrock/litreview/models.yaml and correct the names there; the run
  # records which file it read. To fix properly, correct them here and ship it.
  office:      # the client's GPU, served by vLLM
    small:  {name: qwen3-8b-instruct, thinking: false}
    medium: {name: qwen3-30b-a3b-instruct, thinking: false}
  laptop:      # Ollama on a 16 GB machine
    small:  {name: "qwen3:8b", thinking: false}
    medium: {name: "qwen3:8b", thinking: false}
  medgemma:    # MedGemma 1.5 4B via Ollama; produced docs/litreview/BENCHMARK_RESULTS.md. No thinking mode.
    small:  {name: "medgemma1.5:4b"}
    medium: {name: "medgemma1.5:4b"}

# Which tier does which job.
jobs:
  question: medium     # read the question: entities, type, goal
  relevance: small     # grade one paper's title+abstract against the question
  extract: medium      # copy findings out of one chunk of one section
  write: medium        # write one report section from its evidence slice
  entail: medium       # optional, off by default: does a kept sentence's cited text support it
  judge: medium        # benchmark only: does the cited evidence support a sentence
  baseline: medium     # benchmark only: the chatbot-style comparison answers

embed:
  name: embeddinggemma-300m
  # PICK THIS ONCE. Changing it invalidates every stored vector and forces a
  # full re-index of the corpus. (Not used yet: ranking is lexical + graded.)

defaults:
  temperature: 0.0     # do not raise. Sampling is why chatbots give different
                       # answers to the same question, which is the client's
                       # loudest complaint.
  seed: 0
  max_tokens: 2048
