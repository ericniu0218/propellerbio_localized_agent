# The only place model names live. Nothing else in the codebase hardcodes one,
# so swapping a model — including for a biology-tuned Qwen — is a one-line change.
#
# Two model files, several jobs. The split is by COST, not skill: relevance
# grading runs once per paper so it may use the cheap model; everything else
# runs tens of times per question.
#
# Pick a profile with LLM_PROFILE (default below). A profile says which server
# speaks for the models and how. Every base_url must be on the local network:
# config.py refuses anything else at startup, because a misconfigured endpoint
# is how an air-gap quietly stops being one.

default_profile: office

profiles:
  # The client's in-office GPU, serving through vLLM's OpenAI-compatible API.
  office:
    backend: openai
    base_url: ${LLM_BASE_URL:-http://localhost:8000/v1}
    # `response_format` is the OpenAI-style json_schema field that current vLLM
    # accepts; `guided_json` is the older vLLM-only field. Confirm against the
    # deployed version — it has moved between releases.
    structured_output: response_format
    models:
      small:
        name: qwen3-8b-instruct
        thinking: false
      medium:
        name: qwen3-30b-a3b-instruct
        thinking: false
        # MoE: ~30B total, ~3B active per token. Big-model instruction-following
        # at small-model speed, with long context for whole sections.

  # A developer laptop running Ollama. Same code path, smaller model: this is
  # what the sample runs in evals/ were produced with on a 16 GB machine.
  laptop:
    backend: ollama
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}
    models:
      small:
        name: qwen3:8b
        thinking: false
        num_ctx: 12288
      medium:
        name: qwen3:8b
        thinking: false
        num_ctx: 12288

  # Google's MedGemma 1.5 (4B), a Gemma 3 model tuned on medical text, on a
  # laptop via Ollama. Small enough for a 16 GB machine; used for the first
  # sample runs. Gemma has no "thinking" mode, so none is configured.
  medgemma:
    backend: ollama
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434}
    models:
      small:
        name: medgemma1.5:4b
        num_ctx: 12288
      medium:
        name: medgemma1.5:4b
        num_ctx: 12288

# Which tier does which job.
jobs:
  question: medium     # read the question: entities, type, goal
  relevance: small     # grade one paper's title+abstract against the question
  extract: medium      # copy findings out of one chunk of one section
  write: medium        # write one report section from its evidence slice
  judge: medium        # benchmark only: does the cited evidence support a sentence
  baseline: medium     # benchmark only: the chatbot-style comparison answers

embed:
  name: embeddinggemma-300m
  # PICK THIS ONCE. Changing it invalidates every stored vector and forces a
  # full re-index of the corpus. (Not used yet: ranking is lexical + graded.)

defaults:
  temperature: 0.0     # do not raise. Sampling is why chatbots give different
                       # answers to the same question, which is the client's
                       # loudest complaint.
  seed: 0
  max_tokens: 2048
