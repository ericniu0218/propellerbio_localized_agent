[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-private-ai"
version = "0.1.0"
description = "Employee terminal client for privately hosted open-weight language models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "textual>=3.0",
    "rich>=13.0",
    "httpx>=0.27",
    # Compression for the /digest context store. Falls back to the standard
    # library's lzma when missing, so this is a performance dependency
    # rather than a hard one - see src/bedrock/context/codec.py.
    "zstandard>=0.22",
    # The literature review (src/bedrock/litreview/).
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "lxml>=5.0",          # open-access JATS full text
    "rapidfuzz>=3.0",     # quote matching; a slower pure-Python fallback exists
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# The literature review's optional HTTP front door (bedrock.litreview.api).
# The terminal app never needs it; see docs/prompts/LITREVIEW_INTEGRATION.md.
# The floor is the agent-pack server's (bedrock.server), so one FastAPI serves both.
api = ["fastapi>=0.115", "uvicorn>=0.30"]

# Telling voices apart, and recognising an enrolled one. ONNX only — no
# PyTorch — so it installs on the same laptop as everything else. Optional:
# bedrock.meetings.diarize and .enrollment are guarded imports, and a
# recording without them transcribes exactly as before and is reported as
# unattributed.
speakers = [
    "sherpa-onnx>=1.13",
    "soundfile>=0.12",
    "numpy>=1.24",
]

# The agent-pack server (src/bedrock/server/, started with `bedrock-server`):
# the multi-agent API, the scientist workspace and the meeting recorder, for the
# company's server. Laptops never need it; the terminal app works without it.
# See docs/server/DEPLOYMENT.md.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",   # meeting recording uploads
    "pypdf>=4.0",                # PDF text for workspace uploads
    "python-docx>=1.1",          # Word export of a meeting transcript
    "python-jose[cryptography]>=3.3",  # verifies Keycloak tokens when SSO is configured
    "pydantic>=2.8",
    "python-pptx>=1.0,<2",       # Research tab: PowerPoint export of a finished review
]
# When DATABASE_URL points at Postgres.
postgres = ["psycopg2-binary>=2.9"]
# The meeting recorder's optional helpers on the server. Each import is
# guarded: without them, meeting search ranks by keyword and speakers are
# worked out from the audio. rapidocr-onnxruntime does not install on Python
# 3.13 or later (it declares requires_python <3.13), so screen reading is
# unavailable there until it moves to the `rapidocr` 3.x API.
recorder = [
    "model2vec>=0.9",
    "rapidocr-onnxruntime>=1.2; python_version < '3.13'",
    "pillow>=10.0",
]
# Chemistry and sequence tools for the server's agents. Guarded imports: the
# tools return a clear stub result without them.
chem = ["biopython>=1.83", "rdkit>=2024.3.1"]
# Everything the server can use.
server-all = ["bedrock-private-ai[server,postgres,recorder,speakers,chem]"]

# This is what makes the `bedrock` command exist after `pip install .`
[project.scripts]
bedrock = "bedrock.app:main"
bedrock-biotech = "bedrock.biotech.cli:main"
bedrock-meeting = "bedrock.meetings.cli:main"
bedrock-litreview = "bedrock.litreview.cli:main"
bedrock-server = "bedrock.server.cli:main"
website = "bedrock.server.cli:website"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bedrock = [
    "ui/*.tcss",
    "workspaces/migrations/*.sql",
    "litreview/llm/prompts/*.md",
    "litreview/knowledge/*.yaml",
    "litreview/defaults/*.yaml",
    "server/static/*.html",
    "server/static/workspace/*",
    "server/defaults/*.yaml",
    "server/defaults/vocabulary/*.txt",
    "server/sample_data/*/*.txt",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
