# Report layout, per question type. The client will supply the exact format
# later; this file is where it goes, so changing the report's shape is an edit
# here rather than a code change.
#
# kind: written    one model call, from `source`, under the citation guard
# kind: generated  written by code from the evidence, the ranking and the plan
#
# source (written sections only):
#   top_targets   the best evidence for the leading targets
#   per_target    one subsection per leading target, each from its own evidence
#   facet:<id>    the units extracted for that facet
#   prevention    every finding whose setting is prevention, whatever its facet
#   negative      no-effect / worse / mixed results, and conflicts
#   all           the strongest evidence overall
#
# generated sections: glance, synthesis, disagreements, numbers, glossary, best_source,
# background, gaps, plan, ranking, evidence_table, method, excluded.
# `background` quotes review articles for context; they are never counted as
# evidence. glance/synthesis/disagreements/numbers/glossary are report/synthesis.py: study
# designs, independent-study counts, agreement and an evidence level by a
# written rule, disagreeing studies with whole quotes and qualifiers,
# the papers' quantitative sentences with their study context,
# and the abbreviations the main text uses. best_source, plan, evidence_table,
# ranking, method and excluded are rendered in the Appendix
# (report/layout.py APPENDIX).
#
# findings (written sections only, default true): every sentence must cite at
# least one quote that reports a result, not just mention the subject - a
# methods, demographics or generic-background sentence that states no finding
# is dropped even though it names nothing wrong (report/guard.py). Every
# written section below draws its evidence from extracted findings and exists
# to state some of them, so none sets this to false today; it is here so a
# future section that is genuinely not about a result (a scope note, say) can
# opt out without weakening the check everywhere else.

target_identification:
  - id: answer
    title: Answer
    kind: written
    source: top_targets
    sentences: "3 to 5"
    instructions: >-
      Answer the question directly. Name the targets with the strongest evidence
      for the goal in the question, and for each say what kind of evidence
      supports it (human trial, human genetics, animal model, cells).
  - {id: glance, title: Evidence at a glance, kind: generated}
  - {id: synthesis, title: How the studies line up, kind: generated}
  - {id: disagreements, title: Where the studies disagree, kind: generated}
  - id: targets
    title: Candidate targets
    kind: written
    source: per_target
    sentences: "2 to 4"
    instructions: >-
      Summarise the evidence for this one target: what was done to it, in what
      system, what happened, with the numbers given. Include results where
      acting on it did not help.
  - id: mechanism
    title: Disease biology
    kind: written
    source: facet:mechanism
    sentences: "2 to 5"
    instructions: Describe which pathways, cell types and molecules the evidence shows driving the disease.
  - id: clinical
    title: Human clinical evidence
    kind: written
    source: facet:clinical
    sentences: "2 to 6"
    instructions: Summarise what human studies showed when a target was modulated, with effect sizes and numbers of subjects.
  - id: prevention
    title: Prevention-specific evidence
    kind: written
    source: prevention
    sentences: "1 to 4"
    instructions: >-
      Summarise evidence that acting early, before onset or exposure, or during
      remission prevented the disease or its return.
  - id: negative
    title: Negative and conflicting results
    kind: written
    source: negative
    sentences: "1 to 4"
    instructions: Report where acting on a target did not help, made things worse, or where studies disagree.
  - id: safety
    title: Safety considerations
    kind: written
    source: facet:safety
    sentences: "1 to 4"
    instructions: Summarise the adverse effects and risks reported for acting on these targets.
  - {id: numbers, title: Key results in context, kind: generated}
  - {id: gaps, title: "Limitations, gaps and open questions", kind: generated}
  - {id: background, title: Context from review articles (not primary evidence), kind: generated}
  - {id: glossary, title: Abbreviations, kind: generated}
  - {id: best_source, title: Most relevant source, kind: generated}
  - {id: plan, title: What the answer needed, kind: generated}
  - {id: ranking, title: Papers ranked by relevance, kind: generated}
  - {id: evidence_table, title: Evidence table, kind: generated}
  - {id: method, title: How this answer was assembled, kind: generated}
  - {id: excluded, title: Papers excluded, kind: generated}

intervention_efficacy:
  - id: answer
    title: Answer
    kind: written
    source: all
    sentences: "3 to 5"
    instructions: >-
      Answer the question directly in your first sentence: does the evidence
      show the intervention changes this outcome, in whom, and by how much?
      Give each effect as its quote states it - the change with its units,
      what it was compared with, and when it was measured - never a p-value
      without the change it refers to. Then say what kind of study each
      result comes from, as its quote or context says.
  - {id: glance, title: Evidence at a glance, kind: generated}
  - {id: synthesis, title: How the studies line up, kind: generated}
  - {id: disagreements, title: Where the studies disagree, kind: generated}
  - id: clinical
    title: Clinical efficacy
    kind: written
    source: facet:clinical
    sentences: "2 to 6"
    instructions: >-
      Summarise the human results: for each, what was measured, the size of
      the change with its units, the comparison (placebo, another drug,
      baseline) and the time point, and how many people - as the quotes and
      contexts state them.
  - id: preclinical
    title: Preclinical efficacy
    kind: written
    source: facet:preclinical
    sentences: "1 to 4"
    instructions: Summarise the animal and cell results.
  - id: prevention
    title: Prevention-specific evidence
    kind: written
    source: prevention
    sentences: "1 to 4"
    instructions: Summarise evidence about giving the intervention before onset or exposure.
  - id: mechanism
    title: Mechanism of action
    kind: written
    source: facet:mechanism
    sentences: "1 to 4"
    instructions: Describe how the intervention acts, as the evidence shows it.
  - id: negative
    title: Negative and conflicting results
    kind: written
    source: negative
    sentences: "1 to 4"
    instructions: Report where it did not help, made things worse, or where studies disagree.
  - id: safety
    title: Safety
    kind: written
    source: facet:safety
    sentences: "1 to 4"
    instructions: Summarise adverse events and risks reported.
  - {id: numbers, title: Key results in context, kind: generated}
  - {id: gaps, title: "Limitations, gaps and open questions", kind: generated}
  - {id: background, title: Context from review articles (not primary evidence), kind: generated}
  - {id: glossary, title: Abbreviations, kind: generated}
  - {id: best_source, title: Most relevant source, kind: generated}
  - {id: plan, title: What the answer needed, kind: generated}
  - {id: ranking, title: Papers ranked by relevance, kind: generated}
  - {id: evidence_table, title: Evidence table, kind: generated}
  - {id: method, title: How this answer was assembled, kind: generated}
  - {id: excluded, title: Papers excluded, kind: generated}

default:
  - id: answer
    title: Answer
    kind: written
    source: all
    sentences: "3 to 5"
    instructions: >-
      Answer the question directly from the evidence in your first sentence,
      then say what kind of evidence supports each point. Give each number
      with the comparison and time point its quote states.
  - {id: glance, title: Evidence at a glance, kind: generated}
  - {id: synthesis, title: How the studies line up, kind: generated}
  - {id: disagreements, title: Where the studies disagree, kind: generated}
  - id: evidence
    title: Evidence
    kind: written
    source: all
    sentences: "3 to 8"
    instructions: Summarise the evidence in more detail, with the numbers given.
  - id: negative
    title: Negative and conflicting results
    kind: written
    source: negative
    sentences: "1 to 4"
    instructions: Report results that disagree with the others or show no effect.
  - {id: numbers, title: Key results in context, kind: generated}
  - {id: gaps, title: "Limitations, gaps and open questions", kind: generated}
  - {id: background, title: Context from review articles (not primary evidence), kind: generated}
  - {id: glossary, title: Abbreviations, kind: generated}
  - {id: best_source, title: Most relevant source, kind: generated}
  - {id: plan, title: What the answer needed, kind: generated}
  - {id: ranking, title: Papers ranked by relevance, kind: generated}
  - {id: evidence_table, title: Evidence table, kind: generated}
  - {id: method, title: How this answer was assembled, kind: generated}
  - {id: excluded, title: Papers excluded, kind: generated}
