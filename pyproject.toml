[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-private-ai"
version = "0.1.0"
description = "Employee terminal client for privately hosted open-weight language models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "textual>=3.0",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

# This is what makes the `bedrock` command exist after `pip install .`
[project.scripts]
bedrock = "bedrock.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bedrock = ["ui/*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
