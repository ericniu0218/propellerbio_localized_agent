<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedrock Workspace</title>
<link rel="stylesheet" href="/static/workspace/styles.css">
</head>
<body>

<div id="login" class="login-screen" hidden>
  <div class="login-card hud-none">
    <div class="brand">Bedrock<span>Workspace</span></div>
    <p id="login-copy" class="muted">Sign in to continue.</p>
    <button id="demo-login-btn" class="btn primary" hidden>Continue as demo user</button>
    <a id="sso-login-link" class="btn primary" href="/auth/login" hidden>Log in with company account</a>
    <p id="login-fallback" class="muted small" hidden>No sign-in method is configured on this server yet.</p>
  </div>
</div>

<div id="app" hidden>
  <aside id="sidebar">
    <div class="brand-row">
      <div class="brand">Bedrock<span>Workspace</span></div>
      <span id="demo-badge" class="badge demo" hidden>Demo Environment</span>
    </div>

    <nav id="nav">
      <button class="nav-item active" data-view="chats">Chats</button>
      <button class="nav-item" data-view="projects">Projects</button>
      <button class="nav-item" data-view="memory">Memory</button>
      <button class="nav-item" data-view="meetings">Meetings</button>
      <button class="nav-item disabled" data-view="knowledge" title="Not yet connected">Company Knowledge</button>
      <button class="nav-item disabled" data-view="tools" title="Not yet available">Tools</button>
      <button class="nav-item" data-view="settings">Settings</button>
    </nav>

    <div id="sidebar-list" class="sidebar-list"></div>

    <div id="sidebar-footer">
      <span id="user-name" class="muted small"></span>
      <button id="logout-btn" class="link-btn small">Sign out</button>
    </div>
  </aside>

  <main id="center">
    <header id="center-header">
      <button id="sidebar-menu-btn" class="icon-btn" title="Menu">&#9776;</button>
      <h1 id="center-title">Chats</h1>
      <div id="center-actions"></div>
      <button id="activity-toggle" class="btn ghost small">Agent Activity</button>
    </header>
    <div id="center-body"></div>
  </main>

  <aside id="activity-panel">
    <div id="activity-resizer"></div>
    <header class="activity-header">
      <h2>Agent Activity</h2>
      <div class="activity-header-actions">
        <button id="activity-popout" class="btn ghost small" title="Open in a separate window">Pop out</button>
        <button id="activity-collapse" class="btn ghost small" title="Collapse panel">&raquo;</button>
      </div>
    </header>
    <div id="activity-body"></div>
  </aside>

  <div id="sidebar-scrim"></div>
  <div id="activity-scrim"></div>
</div>

<script src="/static/workspace/app.js"></script>
</body>
</html>
